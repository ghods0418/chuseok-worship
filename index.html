<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>2026년 추석 성묘 예배</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="app">

    <section
      id="page-container"
      class="page-container"
      aria-live="polite"
    >
      <!--
        현재 예배 페이지가
        JavaScript를 통해 이곳에 표시됩니다.
      -->
    </section>

    <nav
      id="page-navigation"
      class="page-navigation"
      aria-label="페이지 이동"
    >

      <button
        id="prev-button"
        type="button"
        aria-label="이전 페이지"
      >
        ‹ 이전
      </button>

      <span
        id="page-indicator"
        aria-label="현재 페이지"
      >
        1 / 14
      </span>

      <button
        id="next-button"
        type="button"
        aria-label="다음 페이지"
      >
        다음 ›
      </button>

    </nav>

  </main>

  <script src="script.js"></script>

</body>
</html>
